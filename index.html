<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Filmes e Séries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra de Navegação -->
    <header id="navbar">
        <div class="logo">StreamFlix</div>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Séries</a></li>
                <li><a href="#">Filmes</a></li>
                <li><a href="#">A Minha Lista</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Secção em Destaque (Hero) -->
        <section class="hero">
            <div class="hero-content">
                <h1>O Grande Épico</h1>
                <p>Uma sinopse envolvente sobre a série em destaque. Ação, drama e muito suspense aguardam por si nesta temporada incrível.</p>
                <div class="hero-buttons">
                    <button class="play-btn">▶ Assistir</button>
                    <button class="info-btn">ℹ Mais Informações</button>
                </div>
            </div>
            <div class="hero-fade-bottom"></div>
        </section>

        <!-- Catálogo de Filmes e Séries -->
        <section class="catalog" id="catalog">
            <!-- As categorias serão geradas dinamicamente pelo JavaScript -->
        </section>
    </main>

    <!-- Ficheiro JavaScript Externo -->
    <script src="script.js"></script>
</body>
</html>
